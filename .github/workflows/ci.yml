name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job_1_of_2-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  job_2_of_2-test:
    runs-on: ubuntu-latest
    needs: job_1_of_2-lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  job_cleanup:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep only last N workflow runs for this branch
        env:
          KEEP_LAST: 1
          # Get branch name: head_ref for PRs, ref_name for others
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Cleaning up branch: $BRANCH (Keeping last $KEEP_LAST runs)"

          # 1. Fetch runs for this workflow + branch, sorted by newest first (default)
          # 2. Slice the array to skip the first 'KEEP_LAST' items
          # 3. Extract the IDs and delete them
          gh run list \
            --workflow "${{ github.workflow }}" \
            --branch "$BRANCH" \
            --json databaseId \
            --limit 100 \
            --jq ".[$KEEP_LAST:] | .[].databaseId" |
          xargs -I{} gh run delete --repo "$GITHUB_REPOSITORY" "{}" || echo "No old runs to delete."