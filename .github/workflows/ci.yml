name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job_1_of_2-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  job_2_of_2-test:
    runs-on: ubuntu-latest
    needs: job_1_of_2-lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  job_cleanup:
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Keep only last N workflow runs (per branch, with min age)
        env:
          KEEP_LAST: 1
          MIN_AGE_HOURS: 1
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          echo "Branch: $BRANCH"
          echo "Keep last: $KEEP_LAST"
          echo "Min age (hours): $MIN_AGE_HOURS"
          echo "Current run: $CURRENT_RUN"

          CURRENT_TIME=$(date +%s)
          MIN_AGE_SECONDS=$((MIN_AGE_HOURS * 3600))

          gh workflow list --repo "$GITHUB_REPOSITORY" --json id --jq '.[].id' |
          while read WF; do
            echo "=== WORKFLOW $WF ==="

            ALL_RUNS=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$WF" \
              --json databaseId,createdAt,headBranch,displayTitle \
              --limit 200)

            echo "=== ALL RUNS FOUND ==="
            echo "$ALL_RUNS" | jq -r '.[] | "\(.databaseId)  \(.createdAt)  \(.headBranch)  \(.displayTitle)"'

            FILTERED=$(echo "$ALL_RUNS" |
              jq --arg branch "$BRANCH" \
                 --argjson current_time "$CURRENT_TIME" \
                 --argjson min_age "$MIN_AGE_SECONDS" \
                 --argjson current_run "$CURRENT_RUN" '
                map(
                  .normalizedBranch =
                    if .headBranch != null then .headBranch
                    elif (.displayTitle | test("\\(")) then
                      (.displayTitle | capture(".*\\((?<b>.*)\\)") | .b)
                    else null end
                )
                |
                map(select(
                  .normalizedBranch == $branch and
                  .databaseId != $current_run and
                  (($current_time - (.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdate)) >= $min_age)
                ))
              ')

            echo "=== RUNS MATCHING BRANCH + AGE FILTER ==="
            echo "$FILTERED" | jq -r '.[] | "\(.databaseId)  \(.createdAt)  \(.normalizedBranch)"'

            TO_DELETE=$(echo "$FILTERED" |
              jq --argjson keep_last "$KEEP_LAST" '
                sort_by(.createdAt) | reverse | .[$keep_last:]
              ')

            echo "=== RUNS SELECTED FOR DELETION ==="
            echo "$TO_DELETE" | jq -r '.[] | "\(.databaseId)  \(.createdAt)  \(.normalizedBranch)"'

            echo "$TO_DELETE" |
              jq -r '.[] | @base64' |
              while read RUN; do
                j() { echo "$RUN" | base64 --decode | jq -r "$1"; }

                ID=$(j '.databaseId')
                CREATED=$(j '.createdAt')
                RUN_BRANCH=$(j '.normalizedBranch')

                echo "  Deleting run $ID (branch: $RUN_BRANCH, date: $CREATED)"
                gh run delete "$ID" --repo "$GITHUB_REPOSITORY" || echo "  Failed to delete $ID"
              done
          done
